<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="./src/output.css" rel="stylesheet">
    <title>Password generator</title>
</head>
<body class="bg-gray-900">
<main class="container flex items-center justify-center p-x-10 min-h-screen">
    <form>
        <div class="space-y-12">
            <div class="border-b border-white/10 pb-12">
                <h2 class="text-base/7 font-semibold text-white">generate password</h2>
                <p class="mt-1 text-sm/6 text-gray-400">It would generate strong and secure password.</p>

                <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
                    <div class="sm:col-span-4">
                        <label for="pass" class="block text-sm/6 font-medium text-white">How many characters do you want</label>
                        <div class="mt-2">
                            <div class="flex items-center rounded-md bg-white/5 pl-3 outline-1 -outline-offset-1 outline-white/10 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-500">
                                <input id="passInput" type="number" name="pass" placeholder="" min="4" max="20" value="4" class="block min-w-0 grow bg-transparent py-1.5 pr-3 pl-1 text-base text-white placeholder:text-gray-500 focus:outline-none sm:text-sm/6" />
                            </div>
                        </div>
                    </div>
                    <div class="sm:col-span-4">
                        <label for="pass" class="block text-sm/6 font-medium text-white">what kind of password do you want</label>
                        <div class="mt-2">
                            <div class="flex items-center  pl-3">
                                <div class="mx-2 flex flex-row justify-around items-center">
                                    <input class="mx-1" type="radio" id="all-val" name="typeOfValue" value="all" checked="checked">
                                    <label for="all-val" class="block text-sm/6 font-medium text-white">All</label>
                                </div>
                                <div class="mx-2 flex flex-row justify-around items-center">
                                    <input class="mx-1" type="radio" id="number-val" name="typeOfValue" value="only-number">
                                    <label for="number-val" class="block text-sm/6 font-medium text-white">only-number</label>
                                </div>
                                <div class="mx-2 flex flex-row justify-around items-center">
                                    <input class="mx-1" type="radio" id="char-val" name="typeOfValue" value="only-character">
                                    <label for="char-val" class="block text-sm/6 font-medium text-white">only-character</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-6 flex items-center justify-end gap-x-6">
            <button id="generateBtn" type="submit" class="rounded-md bg-indigo-500 px-3 py-2 text-sm font-semibold text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500">generate</button>
        </div>
        <div class="flex items-center justify-between gap-x-6 mt-6 border-1 border-white p-3 rounded-md">
            <div id="result" class=" flex items-center justify-center gap-x-6">
            </div>
            <button type="button" class="text-sm/6 font-semibold text-white rounded-md  p-1 hover:bg-amber-50 hover:text-black" onclick="CopyFunc()">Copy</button>
        </div>

    </form>
</main>

<script src="./built/main.js"></script>
</body>
</html>
